[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banalyse"
version = "0.1.0"
description = "FinRobot 业务蓝本 + LangGraph/LangChain 重写：多智能体企业(公司)分析报告工具"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
banalyse = "cli.main:app"

[tool.setuptools.packages.find]
include = ["banalyse*", "cli*"]

# 网页端静态资源随包分发，否则装机后 /static 404
[tool.setuptools.package-data]
"banalyse.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]